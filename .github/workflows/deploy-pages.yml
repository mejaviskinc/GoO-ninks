name: Deploy GoO Ninks to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - CNAME
      - robots.txt
      - sitemap.xml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Assemble static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js CNAME robots.txt sitemap.xml _site/
          touch _site/.nojekyll
          test "$(cat _site/CNAME)" = "gooninks.co.id"
          test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
