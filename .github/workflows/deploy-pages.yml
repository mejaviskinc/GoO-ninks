name: Deploy GoO Ninks to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/gooninks-photo2-part-*.b64'
      - styles.css
      - app.js
      - admin.html
      - admin.css
      - admin.js
      - brand-loader.css
      - brand-loader.js
      - logo-gooninks.svg
      - gooninks-horizontal-logo.svg
      - gooninks-admin-logo.png
      - favicon.svg
      - gn-config.js
      - gn-public.js
      - gn-public.css
      - article.html
      - CNAME
      - robots.txt
      - sitemap.xml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Assemble static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js admin.html admin.css admin.js article.html gn-public.js gn-public.css gn-config.js brand-loader.css brand-loader.js logo-gooninks.svg gooninks-horizontal-logo.svg favicon.svg gooninks-admin-logo.png CNAME robots.txt sitemap.xml _site/
          mkdir -p _site/assets
          cat assets/gooninks-photo2-part-*.b64 | base64 --decode > _site/assets/gooninks-photo2.webp
          test "$(file -b --mime-type _site/assets/gooninks-photo2.webp)" = 'image/webp'
          echo '4bba6073501c50621cca493f98a2993acb43150fe22302cffef7f98e293cdde0  _site/assets/gooninks-photo2.webp' | sha256sum --check
          touch _site/.nojekyll
          test "$(cat _site/CNAME)" = "gooninks.co.id"
          test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
