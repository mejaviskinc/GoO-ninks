name: Deploy GoO Ninks to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - collection.html
      - story.html
      - wastra.html
      - journal.html
      - contact.html
      - special-price.html
      - pages.css
      - 'assets/gooninks-photo2-part-*.b64'
      - assets/gn-footer-payment-methods.png
      - assets/gooninks-story-photo2.webp
      - assets/gooninks-kain-batik-asli-20261025.jpeg
      - assets/gooninks-kain-tenun-asli-20261025.jpeg
      - assets/gooninks-kain-lurik-asli-20261025.jpeg
      - assets/gooninks-hero-editorial-4k.webp
      - assets/gooninks-hero-editorial-1086.webp
      - assets/gooninks-home-background.mp4
      - assets/gooninks-home-poster.jpg
      - styles.css
      - app.js
      - gn-midtrans.js
      - gn-payment-status.js
      - payment-status.html
      - tracking.html
      - gn-tracking.js
      - brand-loader.css
      - brand-loader.js
      - logo-gooninks.svg
      - gooninks-horizontal-logo.svg
      - favicon.svg
      - gn-config.js
      - gn-public.js
      - gn-public.css
      - gn-footer-payments.css
      - gn-payment-doku.svg
      - gn-payment-paypal.svg
      - storefront-plus.css
      - article.html
      - CNAME
      - robots.txt
      - sitemap.xml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      # Cache the new Google Drive source when available. Restore the last known-good
      # homepage video if Drive temporarily blocks downloads.
      - name: Restore optimized homepage video
        id: hero-cache
        uses: actions/cache/restore@v4
        with:
          path: .hero-media
          key: gooninks-hero-1zFkZOrUPkFgNnokTdZQfRZua7Bc-sLwr-v1
          restore-keys: |
            gooninks-hero-1MUhnX5UymowW1RTOWFBwDP5jwNwUNd75-v1
      - name: Prepare homepage video from latest Drive source
        if: steps.hero-cache.outputs.cache-hit != 'true'
        id: rebuild-video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hero-media
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          VIDEO_ID='1zFkZOrUPkFgNnokTdZQfRZua7Bc-sLwr'
          SOURCE=/tmp/gooninks-new-source.mp4
          VALID=0
          if curl --fail --location --retry 2 --max-time 300 \
            "https://drive.usercontent.google.com/download?id=${VIDEO_ID}&export=download&confirm=t" \
            -o "$SOURCE" && ffprobe -v error "$SOURCE" >/dev/null 2>&1; then
            VALID=1
          else
            echo "::warning::Direct Google Drive media download failed; attempting shared-link download."
            rm -f "$SOURCE"
            python -m pip install --quiet gdown
            if python -m gdown "https://drive.google.com/uc?id=${VIDEO_ID}" -O "$SOURCE" \
               && ffprobe -v error "$SOURCE" >/dev/null 2>&1; then
              VALID=1
            fi
          fi
          if [ "$VALID" = 1 ]; then
            echo 'New Google Drive source is a valid video. Optimizing for web.'
            if ffmpeg -hide_banner -loglevel error -y -i "$SOURCE" -an \
              -vf 'scale=1280:-2,fps=24' -c:v libx264 -preset veryfast -crf 29 \
              -movflags +faststart /tmp/gooninks-optimized.mp4 \
              && ffmpeg -hide_banner -loglevel error -y -ss 2 -i "$SOURCE" \
              -frames:v 1 -vf scale=1280:-2 /tmp/gooninks-optimized.jpg; then
              mv /tmp/gooninks-optimized.mp4 .hero-media/gooninks-home-background.mp4
              mv /tmp/gooninks-optimized.jpg .hero-media/gooninks-home-poster.jpg
              echo "fresh=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ ! -s .hero-media/gooninks-home-background.mp4 ] || \
             [ ! -s .hero-media/gooninks-home-poster.jpg ]; then
            echo "::error::Video unavailable in Drive and no backup cache was found."
            exit 1
          fi
          ffprobe -v error .hero-media/gooninks-home-background.mp4 >/dev/null
          echo 'Optimized homepage video ready for deployment.'
      - name: Save successfully optimized new video
        if: steps.rebuild-video.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: .hero-media
          key: gooninks-hero-1zFkZOrUPkFgNnokTdZQfRZua7Bc-sLwr-v1
      - name: Validate storefront JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check gn-public.js
          node --check gn-midtrans.js
          node --check gn-tracking.js
          test -s tracking.html
          grep -q 'gn-tracking.js' tracking.html
          grep -q 'name="promo_code"' index.html
          grep -q 'name="promo_code"' collection.html
      - name: Assemble static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html collection.html story.html wastra.html journal.html contact.html special-price.html pages.css styles.css app.js gn-midtrans.js gn-payment-status.js payment-status.html tracking.html gn-tracking.js article.html gn-public.js gn-public.css gn-footer-payments.css gn-payment-doku.svg gn-payment-paypal.svg storefront-plus.css gn-config.js brand-loader.css brand-loader.js logo-gooninks.svg gooninks-horizontal-logo.svg favicon.svg CNAME robots.txt sitemap.xml _site/
          mkdir -p _site/assets
          cp .hero-media/gooninks-home-background.mp4 .hero-media/gooninks-home-poster.jpg _site/assets/
          cp assets/gn-footer-payment-methods.png _site/assets/
          cp assets/gooninks-story-photo2.webp _site/assets/
          cp assets/gooninks-kain-batik-asli-20261025.jpeg assets/gooninks-kain-tenun-asli-20261025.jpeg assets/gooninks-kain-lurik-asli-20261025.jpeg _site/assets/
          echo '61f552bc3345b736a6c786487ce409f75f295ae7b5e82bc9c1e84f15cfee5bb7  _site/assets/gooninks-kain-batik-asli-20261025.jpeg' | sha256sum --check
          echo '4fafd77cee9d18f1eea1a7f9809a4536cbd11a03b6c2086041cd40cfb8852004  _site/assets/gooninks-kain-tenun-asli-20261025.jpeg' | sha256sum --check
          echo 'e78d22c636a52dc031492cf8741146e9ab1716a42c1f9b13dfa04d24efe9ae4e  _site/assets/gooninks-kain-lurik-asli-20261025.jpeg' | sha256sum --check
          cp assets/gooninks-hero-editorial-4k.webp assets/gooninks-hero-editorial-1086.webp _site/assets/
          cat assets/gooninks-photo2-part-*.b64 | base64 --decode > _site/assets/gooninks-photo2.webp
          test "$(file -b --mime-type _site/assets/gooninks-photo2.webp)" = 'image/webp'
          echo '4bba6073501c50621cca493f98a2993acb43150fe22302cffef7f98e293cdde0  _site/assets/gooninks-photo2.webp' | sha256sum --check
          test -s _site/assets/gooninks-hero-editorial-4k.webp
          test -s _site/assets/gooninks-hero-editorial-1086.webp
          touch _site/.nojekyll
          test "$(cat _site/CNAME)" = "gooninks.co.id"
          test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
