name: Import GoO Ninks Drive product photography
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-gooninks-drive-photos.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gooninks-drive-photo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install image optimizer and Drive downloader
        run: |
          set -euo pipefail
          python -m pip install --quiet "gdown>=5,<6" "Pillow>=11,<13"
      - name: Download and optimize all six photo sets
        run: |
          set -euo pipefail
          python scripts/import-gooninks-photos.py
      - name: Verify complete asset collection
        run: |
          set -euo pipefail
          test "$(find assets/gooninks-lookbook -type f -name '*.webp' | wc -l)" -eq 322
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets/gooninks-lookbook')
          data=json.loads((root/'manifest.json').read_text())
          assert data['total_photos']==322
          assert len(data['groups'])==6
          assert all((Path('.'+image['src'])).is_file() for g in data['groups'] for image in g['images'])
          print('Complete photo manifest and all 322 web images verified')
          PY
      - name: Save optimized images and product photo manifest
        run: |
          set -euo pipefail
          git config user.name "GoO Ninks Photo Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gooninks-lookbook
          if git diff --cached --quiet; then
            echo 'No image changes'
            exit 0
          fi
          git commit -m "Publish all 322 optimized GoO Ninks studio photos"
          # The storefront may have received new commits while photos downloaded.
          # Rebase the independent generated-image commit instead of force pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'All optimized photos committed to the live repository'
              exit 0
            fi
            echo "Repository updated during push, retry $attempt"
            sleep 3
          done
          echo 'Could not publish optimized photos after three safe retries'
          exit 1
