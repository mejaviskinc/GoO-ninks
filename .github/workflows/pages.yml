name: Publish GoO Ninks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish storefront
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Verify storefront and payment options
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s gn-midtrans.js
          test -s styles.css
          grep -q 'id="gnPaymentChoice"' index.html
          grep -q 'id="gnPaymentLocal"' index.html
          grep -q 'id="gnPaymentIntl"' index.html
          grep -q 'gnPaymentChoiceRuntimeStyles' gn-midtrans.js
          grep -Fx 'gooninks.co.id' CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
