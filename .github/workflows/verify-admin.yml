name: Verify GoO Ninks Admin & CMS
on:
  push:
    paths:
      - .github/workflows/verify-admin.yml
      - admin.html
      - admin.js
      - gn-midtrans.js
      - gn-payment-status.js
      - payment-status.html
      - admin.css
      - index.html
      - styles.css
      - 'assets/gooninks-photo2-part-*.b64'
      - assets/gooninks-hero-editorial-4k.webp
      - assets/gooninks-hero-editorial-1086.webp
      - article.html
      - brand-loader.css
      - brand-loader.js
      - favicon.svg
      - logo-gooninks.svg
      - gooninks-horizontal-logo.svg
      - gooninks-admin-logo.png
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and deployment package
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check admin.js
          node --check gn-midtrans.js
          node --check gn-payment-status.js
          node --check brand-loader.js
          node --check gn-public.js
          node --check gn-config.js
          cat assets/gooninks-photo2-part-*.b64 | base64 --decode > /tmp/gooninks-photo2.webp
          test "$(file -b --mime-type /tmp/gooninks-photo2.webp)" = image/webp
          echo '4bba6073501c50621cca493f98a2993acb43150fe22302cffef7f98e293cdde0  /tmp/gooninks-photo2.webp' | sha256sum --check
          test "$(file -b --mime-type assets/gooninks-hero-editorial-4k.webp)" = image/webp
          test "$(file -b --mime-type assets/gooninks-hero-editorial-1086.webp)" = image/webp
          echo '798c1b6d17032e7a51b26d92717797e8cf6d3767f2e4626f4956c6f34982b912  assets/gooninks-hero-editorial-4k.webp' | sha256sum --check
          echo 'c19b37ce0d7a1629f80c6675cb03e1544a5ab0d432aa2cabf1393625d9aa1097  assets/gooninks-hero-editorial-1086.webp' | sha256sum --check
          grep -q 'src="/assets/gooninks-hero-editorial-4k.webp?v=20261022"' index.html
          grep -q 'gn-hero-editorial' styles.css
          grep -q 'gooninks-hero-editorial-4k.webp' .github/workflows/deploy-pages.yml
          ! grep -q 'src="/assets/gooninks-photo2.webp?v=20261021"' index.html
          echo 'Latest user-supplied 4K photo configured as Tradition Reimagined hero'
          for file in gn-midtrans.js gn-payment-status.js payment-status.html index.html admin.html admin.css admin.js gn-public.js gn-public.css gn-config.js article.html logo-gooninks.svg gooninks-horizontal-logo.svg favicon.svg gooninks-admin-logo.png brand-loader.css brand-loader.js; do
            test -s "$file"
          done
          grep -q 'id="signupForm"' admin.html
          grep -q 'id="teamNav"' admin.html
          grep -q 'id="midtransForm"' index.html
          grep -q 'src="gn-midtrans.js"' index.html
          grep -q 'data-view="orders"' admin.html
          grep -q 'gn_payment_reserve_v1' supabase/functions/gn-midtrans-checkout/index.ts
          grep -q 'SHA-512' supabase/functions/gn-midtrans-webhook/index.ts
          echo "Midtrans frontend and private orders UI ready"
          grep -q 'auth.signUp' admin.js
          grep -q 'changeTeam' admin.js
          for page in index.html admin.html article.html; do
            grep -q 'href="/favicon.svg?v=3"' "$page"
            grep -q 'id="gnBootLoader"' "$page"
          done
          grep -q 'GoO Ninks logo' logo-gooninks.svg
          grep -q 'GoO Ninks GN favicon' favicon.svg
          ! grep -q '<rect' favicon.svg
          grep -q 'background:transparent;border:0;box-shadow:none' admin.css
          grep -q 'GoO Ninks branding and responsive studio layout' admin.css
          grep -q 'gn-sidebar-brand img{display:block;width:120px' admin.css
          grep -q 'gn-admin-form-logo{display:block;width:128px' admin.css
          ! grep -q 'background:#0b0b0b' admin.css
          ! grep -q 'background:#0c0c0c' admin.css
          grep -q '/gooninks-admin-logo.png?v=20261021' admin.html
          test "$(file -b --mime-type gooninks-admin-logo.png)" = image/png
          echo "Owner's official transparent PNG logo installed"
          echo "Transparent admin logo containers and favicon PASS"
          grep -q 'class="brand gn-brand-auth"' admin.html
          grep -q 'class="auth-mark gn-admin-monogram gn-admin-form-logo"' admin.html
          grep -q 'class="sidebar-brand gn-sidebar-brand"' admin.html
          grep -q 'class="gn-topbar-logo gn-topbar-full-logo"' admin.html
          grep -q 'gn-sidebar-brand' admin.css
          for page in index.html admin.html article.html; do
            grep -q "Keep GoO Ninks URLs clean" "$page"
            grep -q "history.replaceState" "$page"
          done
          node <<'NODE'
          const clean = (href) => {
            const u = new URL(href);
            if (u.searchParams.get('utm_source') === 'chatgpt.com') {
              u.searchParams.delete('utm_source');
              const q = u.searchParams.toString();
              return u.pathname + (q ? '?' + q : '') + u.hash;
            }
            return u.pathname + u.search + u.hash;
          };
          const tests = [
            ['https://gooninks.co.id/?utm_source=chatgpt.com','/'],
            ['https://gooninks.co.id/admin.html?utm_source=chatgpt.com','/admin.html'],
            ['https://gooninks.co.id/article.html?slug=contoh&utm_source=chatgpt.com#bagian','/article.html?slug=contoh#bagian'],
            ['https://gooninks.co.id/?utm_source=newsletter','/?utm_source=newsletter'],
            ['https://gooninks.co.id/admin.html?token=abc&utm_source=chatgpt.com','/admin.html?token=abc']
          ];
          for(const [url,expected] of tests) {
            if(clean(url)!==expected) throw new Error('URL cleanup failed for '+url);
          }
          console.log('Referral cleanup and preservation tests passed');
          NODE
          echo "Admin uses official GN logo in login, sidebar, and topbar"
          grep -q 'gn-official-wordmark' index.html
          grep -q 'gn-official-footer' index.html
          grep -q 'gooninks-horizontal-logo.svg?v=1' index.html
          ! grep -q 'EST. 2010 · YOGYAKARTA' index.html
          grep -q 'gn-official-wordmark' styles.css
          grep -q 'GoO Ninks — logo emas resmi' gooninks-horizontal-logo.svg
          echo "Official golden branding in header and footer PASSED"
          echo "Logo loader, favicon, registration controls and JS syntax PASSED"
      - name: Check pinned Supabase browser library
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            -o /tmp/supabase-lib.js \
            https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js
          test $(wc -c </tmp/supabase-lib.js) -gt 10000
          echo "Supabase JS UMD dependency PASSED"
      - name: Confirm live Admin & CMS files
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl --silent --location --output /tmp/admin-check --write-out "%{http_code}" --max-time 12 https://gooninks.co.id/admin.html || true)
            if [ "$code" = 200 ] && grep -q 'id="signupForm"' /tmp/admin-check; then break; fi
            sleep 8
          done
          test "$code" = 200
          grep -q 'id="signupForm"' /tmp/admin-check
          grep -q 'id="teamNav"' /tmp/admin-check
          for file in admin.css admin.js gn-public.js gn-public.css gn-config.js article.html; do
            curl --fail --silent --show-error --location --max-time 15 \
              -o /dev/null --write-out "$file HTTP %{http_code}\n" "https://gooninks.co.id/$file"
          done
          curl --fail --silent --show-error --location --max-time 15 https://gooninks.co.id/admin.js -o /tmp/live-admin.js
          grep -q 'auth.signUp' /tmp/live-admin.js
          grep -q 'loadTeam' /tmp/live-admin.js
          echo "Production self-registration and account approval UI PASSED"

      - name: Verify live logo and favicon deployment
        shell: bash
        run: |
          set -euo pipefail
          for asset in favicon.svg logo-gooninks.svg brand-loader.css brand-loader.js; do
            curl --fail --silent --show-error --location --max-time 18 \
              "https://gooninks.co.id/$asset" -o "/tmp/$(basename "$asset")"
            test -s "/tmp/$(basename "$asset")"
            echo "LIVE ASSET OK: $asset"
          done
          grep -q 'GoO Ninks GN favicon' /tmp/favicon.svg
          ! grep -q '<rect' /tmp/favicon.svg
          curl --fail --silent --show-error --location --max-time 18 https://gooninks.co.id/admin.css -o /tmp/live-admin.css
          grep -q 'background:transparent;border:0;box-shadow:none' /tmp/live-admin.css
          grep -q 'GoO Ninks branding and responsive studio layout' /tmp/live-admin.css
          curl --fail --silent --show-error --location --max-time 20 "https://gooninks.co.id/gooninks-admin-logo.png?v=20261021" -o /tmp/gooninks-admin-logo.png
          test "$(file -b --mime-type /tmp/gooninks-admin-logo.png)" = image/png
          grep -q 'GoO Ninks logo' /tmp/logo-gooninks.svg
          grep -q 'gn-boot-hidden' /tmp/brand-loader.js
          for page in '' admin.html article.html; do
            curl --fail --silent --show-error --location --max-time 18 \
              "https://gooninks.co.id/$page" -o /tmp/brand-page.html
            grep -q 'id="gnBootLoader"' /tmp/brand-page.html
            if [ "$page" = "admin.html" ]; then
              grep -q 'class="sidebar-brand gn-sidebar-brand"' /tmp/brand-page.html
              grep -q 'class="brand gn-brand-auth"' /tmp/brand-page.html
              grep -q 'class="auth-mark gn-admin-monogram gn-admin-form-logo"' /tmp/brand-page.html
              grep -q '/gooninks-admin-logo.png?v=20261021' /tmp/brand-page.html
            fi
            grep -q 'href="/favicon.svg?v=3"' /tmp/brand-page.html
            grep -q 'Keep GoO Ninks URLs clean' /tmp/brand-page.html
            if [ "$page" = "" ]; then
            grep -q 'gn-official-wordmark' /tmp/brand-page.html
            grep -q 'gn-official-footer' /tmp/brand-page.html
          fi
          echo "LIVE PAGE OK: /$page"
          done

      - name: Verify live official header logo asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://gooninks.co.id/gooninks-horizontal-logo.svg -o /tmp/header-logo.svg
          grep -q 'GoO Ninks — logo emas resmi' /tmp/header-logo.svg
          test "$(wc -c </tmp/header-logo.svg)" -gt 2500
          echo "GoO Ninks gold header logo reachable and valid"

      - name: Verify latest 4K user photo on live Tradition Reimagined hero
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error --location --max-time 20 https://gooninks.co.id/assets/gooninks-hero-editorial-4k.webp -o /tmp/live-hero.webp || true
            if echo '798c1b6d17032e7a51b26d92717797e8cf6d3767f2e4626f4956c6f34982b912  /tmp/live-hero.webp' | sha256sum --check --status 2>/dev/null; then
              break
            fi
            sleep 8
          done
          echo '798c1b6d17032e7a51b26d92717797e8cf6d3767f2e4626f4956c6f34982b912  /tmp/live-hero.webp' | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 https://gooninks.co.id/ -o /tmp/gooninks-live-home.html
          grep -q '/assets/gooninks-hero-editorial-4k.webp?v=20261022' /tmp/gooninks-live-home.html
          echo 'Live GoO Ninks hero displays latest user-supplied image'
