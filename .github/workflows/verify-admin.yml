name: Verify GoO Ninks Admin & CMS
on:
  push:
    paths:
      - .github/workflows/verify-admin.yml
      - admin.html
      - admin.js
      - admin.css
      - index.html
      - article.html
      - brand-loader.css
      - brand-loader.js
      - favicon.svg
      - logo-gooninks.svg
      - gooninks-admin-logo.png
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and deployment package
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check admin.js
          node --check brand-loader.js
          node --check gn-public.js
          node --check gn-config.js
          for file in index.html admin.html admin.css admin.js gn-public.js gn-public.css gn-config.js article.html logo-gooninks.svg favicon.svg gooninks-admin-logo.png brand-loader.css brand-loader.js; do
            test -s "$file"
          done
          grep -q 'id="signupForm"' admin.html
          grep -q 'id="teamNav"' admin.html
          grep -q 'auth.signUp' admin.js
          grep -q 'changeTeam' admin.js
          for page in index.html admin.html article.html; do
            grep -q 'href="/favicon.svg?v=3"' "$page"
            grep -q 'id="gnBootLoader"' "$page"
          done
          grep -q 'GoO Ninks logo' logo-gooninks.svg
          grep -q 'GoO Ninks GN favicon' favicon.svg
          ! grep -q '<rect' favicon.svg
          grep -q 'TRANSPARENT_GOO_NINKS_BRANDING' admin.css
          ! grep -q 'background:#0b0b0b' admin.css
          ! grep -q 'background:#0c0c0c' admin.css
          grep -q '/gooninks-admin-logo.png?v=20261021' admin.html
          test "$(file -b --mime-type gooninks-admin-logo.png)" = image/png
          echo "Owner's official transparent PNG logo installed"
          echo "Transparent admin logo containers and favicon PASS"
          grep -q 'class="brand gn-brand-auth"' admin.html
          grep -q 'class="auth-mark gn-admin-monogram gn-admin-form-logo"' admin.html
          grep -q 'class="sidebar-brand gn-sidebar-brand"' admin.html
          grep -q 'class="gn-topbar-logo"' admin.html
          grep -q 'gn-sidebar-brand' admin.css
          for page in index.html admin.html article.html; do
            grep -q "Keep GoO Ninks URLs clean" "$page"
            grep -q "history.replaceState" "$page"
          done
          node <<'NODE'
          const clean = (href) => {
            const u = new URL(href);
            if (u.searchParams.get('utm_source') === 'chatgpt.com') {
              u.searchParams.delete('utm_source');
              const q = u.searchParams.toString();
              return u.pathname + (q ? '?' + q : '') + u.hash;
            }
            return u.pathname + u.search + u.hash;
          };
          const tests = [
            ['https://gooninks.co.id/?utm_source=chatgpt.com','/'],
            ['https://gooninks.co.id/admin.html?utm_source=chatgpt.com','/admin.html'],
            ['https://gooninks.co.id/article.html?slug=contoh&utm_source=chatgpt.com#bagian','/article.html?slug=contoh#bagian'],
            ['https://gooninks.co.id/?utm_source=newsletter','/?utm_source=newsletter'],
            ['https://gooninks.co.id/admin.html?token=abc&utm_source=chatgpt.com','/admin.html?token=abc']
          ];
          for(const [url,expected] of tests) {
            if(clean(url)!==expected) throw new Error('URL cleanup failed for '+url);
          }
          console.log('Referral cleanup and preservation tests passed');
          NODE
          echo "Admin uses official GN logo in login, sidebar, and topbar"
          echo "Logo loader, favicon, registration controls and JS syntax PASSED"
      - name: Check pinned Supabase browser library
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            -o /tmp/supabase-lib.js \
            https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js
          test $(wc -c </tmp/supabase-lib.js) -gt 10000
          echo "Supabase JS UMD dependency PASSED"
      - name: Confirm live Admin & CMS files
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl --silent --location --output /tmp/admin-check --write-out "%{http_code}" --max-time 12 https://gooninks.co.id/admin.html || true)
            if [ "$code" = 200 ] && grep -q 'id="signupForm"' /tmp/admin-check; then break; fi
            sleep 8
          done
          test "$code" = 200
          grep -q 'id="signupForm"' /tmp/admin-check
          grep -q 'id="teamNav"' /tmp/admin-check
          for file in admin.css admin.js gn-public.js gn-public.css gn-config.js article.html; do
            curl --fail --silent --show-error --location --max-time 15 \
              -o /dev/null --write-out "$file HTTP %{http_code}\n" "https://gooninks.co.id/$file"
          done
          curl --fail --silent --show-error --location --max-time 15 https://gooninks.co.id/admin.js -o /tmp/live-admin.js
          grep -q 'auth.signUp' /tmp/live-admin.js
          grep -q 'loadTeam' /tmp/live-admin.js
          echo "Production self-registration and account approval UI PASSED"

      - name: Verify live logo and favicon deployment
        shell: bash
        run: |
          set -euo pipefail
          for asset in favicon.svg logo-gooninks.svg brand-loader.css brand-loader.js; do
            curl --fail --silent --show-error --location --max-time 18 \
              "https://gooninks.co.id/$asset" -o "/tmp/$(basename "$asset")"
            test -s "/tmp/$(basename "$asset")"
            echo "LIVE ASSET OK: $asset"
          done
          grep -q 'GoO Ninks GN favicon' /tmp/favicon.svg
          ! grep -q '<rect' /tmp/favicon.svg
          curl --fail --silent --show-error --location --max-time 18 https://gooninks.co.id/admin.css -o /tmp/live-admin.css
          grep -q 'TRANSPARENT_GOO_NINKS_BRANDING' /tmp/live-admin.css
          curl --fail --silent --show-error --location --max-time 20 "https://gooninks.co.id/gooninks-admin-logo.png?v=20261021" -o /tmp/gooninks-admin-logo.png
          test "$(file -b --mime-type /tmp/gooninks-admin-logo.png)" = image/png
          grep -q 'GoO Ninks logo' /tmp/logo-gooninks.svg
          grep -q 'gn-boot-hidden' /tmp/brand-loader.js
          for page in '' admin.html article.html; do
            curl --fail --silent --show-error --location --max-time 18 \
              "https://gooninks.co.id/$page" -o /tmp/brand-page.html
            grep -q 'id="gnBootLoader"' /tmp/brand-page.html
            if [ "$page" = "admin.html" ]; then
              grep -q 'class="sidebar-brand gn-sidebar-brand"' /tmp/brand-page.html
              grep -q 'class="brand gn-brand-auth"' /tmp/brand-page.html
              grep -q 'class="auth-mark gn-admin-monogram gn-admin-form-logo"' /tmp/brand-page.html
              grep -q '/gooninks-admin-logo.png?v=20261021' /tmp/brand-page.html
            fi
            grep -q 'href="/favicon.svg?v=3"' /tmp/brand-page.html
            grep -q 'Keep GoO Ninks URLs clean' /tmp/brand-page.html
            echo "LIVE PAGE OK: /$page"
          done
