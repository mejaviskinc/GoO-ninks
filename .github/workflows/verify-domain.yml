name: Verify gooninks.co.id deployment
on:
  push:
    paths:
      - .github/workflows/verify-domain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check domain DNS and HTTPS
        shell: bash
        run: |
          set +e
          echo "=== DNS A records (default resolver) ==="
          dig +time=4 +tries=1 +short gooninks.co.id A
          echo "=== DNS A records (Cloudflare resolver) ==="
          dig @1.1.1.1 +time=4 +tries=1 +short gooninks.co.id A
          echo "=== DNS www CNAME ==="
          dig @1.1.1.1 +time=4 +tries=1 +short www.gooninks.co.id CNAME
          echo "=== DNS nameservers ==="
          dig @1.1.1.1 +time=4 +tries=1 +short gooninks.co.id NS
          echo "=== Website HTTPS check ==="
          for url in "https://gooninks.co.id/" "https://www.gooninks.co.id/" "https://mejaviskinc.github.io/GoO-ninks/"; do
            echo "--- $url"
            curl --max-time 20 --connect-timeout 8 --location --silent --show-error \
              --output /tmp/gooninks_response --write-out 'http_code=%{http_code}\nfinal_url=%{url_effective}\nssl_verify=%{ssl_verify_result}\n' "$url"
            echo "curl_exit=$?"
            if grep -qi 'GoO Ninks' /tmp/gooninks_response; then echo "GoO Ninks content found"; else echo "GoO Ninks content not found"; fi
          done
          echo "=== Verify expected website files ==="
          for path in styles.css app.js robots.txt sitemap.xml; do
            echo "--- $path"
            curl --max-time 15 --connect-timeout 8 --location --silent --show-error --output /dev/null --write-out "status=%{http_code}\n" "https://gooninks.co.id/$path"
          done
