name: Verify gooninks.co.id deployment
on:
  push:
    paths:
      - .github/workflows/verify-domain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production DNS, TLS, HTML, and static assets
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Authoritative nameservers ==="
          dig @1.1.1.1 +time=4 +tries=1 +short gooninks.co.id NS || true
          echo "=== DNS SOA ==="
          dig @1.1.1.1 +time=4 +tries=1 +short gooninks.co.id SOA || true
          echo "=== DNS AAAA records ==="
          dig @1.1.1.1 +time=4 +tries=1 +short gooninks.co.id AAAA || true
          echo "=== www CNAME ==="
          dig @1.1.1.1 +time=4 +tries=1 +short www.gooninks.co.id CNAME || true
          echo "=== Live TLS headers (nonfatal diagnostic) ==="
          curl --location --head --show-error --max-time 15 https://gooninks.co.id/ || true
          echo "=== GitHub Pages diagnostic (nonfatal) ==="
          curl --location --head --show-error --max-time 15 https://mejaviskinc.github.io/GoO-ninks/ || true
          echo "=== DNS A records ==="
          dig @1.1.1.1 +time=4 +tries=1 +short gooninks.co.id A | sort | tee /tmp/addresses
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do grep -Fxq "$ip" /tmp/addresses; done
          echo "=== DNS www ==="
          dig @1.1.1.1 +time=4 +tries=1 +short www.gooninks.co.id CNAME
          echo "=== HTTPS production homepage ==="
          curl --fail --show-error --silent --location --max-time 30 \
            --output /tmp/home --write-out 'HTTP %{http_code} final=%{url_effective} TLS_verify=%{ssl_verify_result}\n' \
            https://gooninks.co.id/
          grep -qi "GoO Ninks" /tmp/home
          echo "Homepage contains GoO Ninks"
          echo "=== HTTPS static files ==="
          for path in styles.css app.js robots.txt sitemap.xml; do
            echo "Checking $path"
            curl --fail --show-error --silent --location --max-time 20 \
              --output /dev/null --write-out 'HTTP %{http_code}\n' \
              "https://gooninks.co.id/$path"
          done
          echo "=== HTTPS www redirect ==="
          curl --fail --show-error --silent --location --max-time 30 \
            --output /dev/null --write-out 'HTTP %{http_code} final=%{url_effective}\n' \
            https://www.gooninks.co.id/
          echo "Production health checks PASSED."
